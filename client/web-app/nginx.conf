server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip the static bundle
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------
    # API reverse proxy.
    # The SPA is built with VITE_API_URL=/api, so the browser calls the
    # same origin and Nginx forwards to the Node API container.
    # ---------------------------------------------------------------
    location /api/ {
        # Resolve the service name at request time through Docker's embedded
        # DNS. With a literal host, Nginx resolves once at startup and exits
        # with "host not found in upstream" if the api container is not up yet.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass         $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Swagger JSON is served outside the /api prefix by server.ts
    location = /api-docs/json {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_docs_upstream http://api:8080;
        proxy_pass       $api_docs_upstream$request_uri;
        proxy_set_header Host $host;
    }

    # Hashed Vite assets can be cached hard; a miss must 404, not fall
    # through to index.html (that is what produces "Unexpected token '<'"
    # errors in the console).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------
    # SPA fallback: React Router owns client-side routes, so any path
    # that is not a real file must return index.html instead of 404.
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or users keep the old bundle.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
