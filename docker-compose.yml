name: evat

# ---------------------------------------------------------------------------
# EVAT full stack
#   web       Nginx serving the Vite build + reverse proxy for /api   :3000
#   api       Node/Express API (compiled TypeScript)                  :8080
#   pythonsvc Combined FastAPI ML service (server/python-services)    :5000
#
# MongoDB is NOT started here - the stack points at the company MongoDB
# instance via MONGODB_URI (see server/node-api/.env).
#
# HOST PORTS are overridable, because 8080 (Jenkins) and 5000 (macOS AirPlay
# Receiver) are commonly taken. Only the host side moves - inside the network
# the services always listen on 3000/8080/5000, so PYTHON_API_URL and the Nginx
# proxy are unaffected. Override in the root .env or inline:
#     API_HOST_PORT=9090 docker compose up -d
#
# Requires Docker Compose v2.24+ (for `env_file: required: false`).
# ---------------------------------------------------------------------------

services:
  pythonsvc:
    build:
      context: .
      dockerfile: server/python-services/Dockerfile
    image: evat-pythonsvc:local
    container_name: evat-pythonsvc
    env_file:
      # weatherAwareRouting/config.py reads GOOGLE_MAPS_API_KEY from here.
      # Real env vars still win, because load_dotenv() does not override them.
      - path: ./server/node-api/.env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      # macOS: AirPlay Receiver owns 5000 - set PY_HOST_PORT=5001 if it clashes.
      - "${PY_HOST_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 5s
      # Startup trains the cost-comparison model and loads the price model,
      # so give it a generous grace period before marking it unhealthy.
      start_period: 240s
      retries: 5
    restart: unless-stopped
    networks: [evat]

  api:
    build:
      context: ./server/node-api
      dockerfile: Dockerfile
    image: evat-api:local
    container_name: evat-api
    env_file:
      - path: ./server/node-api/.env
        required: false
    environment:
      # `environment` overrides `env_file`, so these win even if the local
      # .env still contains a 127.0.0.1 value.
      PORT: "8080"
      # Inside Compose, 127.0.0.1 is the API container itself. Reach the
      # Python service by its service name on the shared network.
      PYTHON_API_URL: "http://pythonsvc:5000"
      # Swagger's "Try it out" must target the published host port, not the
      # port the process listens on inside the container.
      PUBLIC_API_URL: "http://localhost:${API_HOST_PORT:-8081}"
      #
      # Do NOT list MONGODB_URI / JWT_SECRET / GOOGLE_* here. Anything named in
      # `environment` overrides `env_file`, and an unset "${VAR:-}" resolves to
      # an empty string that silently wins over the real value in
      # server/node-api/.env. Only variables that MUST differ inside a
      # container belong in this block.
    depends_on:
      pythonsvc:
        condition: service_started
    ports:
      # Default 8081, because a local Jenkins commonly owns host 8080.
      # The container still listens on 8080; only the host side moves.
      - "${API_HOST_PORT:-8081}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:8080/api-docs/json',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 5
    restart: unless-stopped
    networks: [evat]

  web:
    build:
      context: ./client/web-app
      dockerfile: Dockerfile
      args:
        # Same-origin API path; Nginx proxies /api/ to the api service.
        VITE_API_URL: "${VITE_API_URL:-/api}"
        VITE_GOOGLE_MAPS_API_KEY: "${VITE_GOOGLE_MAPS_API_KEY:-}"
        VITE_GA_TRACKING_ID: "${VITE_GA_TRACKING_ID:-}"
    image: evat-web:local
    container_name: evat-web
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_HOST_PORT:-3000}:80"
    restart: unless-stopped
    networks: [evat]

networks:
  evat:
    driver: bridge

# The reliability scoring API (server/python-services/reliability_scoring_api,
# RELIABILITY_API_URL, port 8003) is still a separate uvicorn app and is not
# containerised here. Add it as a fourth service and set
# RELIABILITY_API_URL=http://reliability:8003 on `api` when it is needed.
