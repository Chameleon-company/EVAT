name: Pull Request Build

on:
  pull_request:
    branches:
      - main

jobs:
  build-server:
    name: Build Node API
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Node API
        run: npm run build:server

  build-client:
    name: Build web client
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web client
        run: npm run build:client

  test-python-ml:
    name: Test Python ML Services
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python-requirements.txt
            server/python-services/requirements-test.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-requirements.txt
          pip install -r server/python-services/requirements-test.txt

      - name: Run ML service tests
        working-directory: server/python-services
        run: |
          python -m pytest \
            charging_station_recommendation_api/tests \
            environmental_impact_analysis/tests \
            pricePrediction/tests \
            -v
            