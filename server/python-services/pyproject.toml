[project]
name = "evat-python-services"
version = "0.1.0"
description = "Python APIs and machine-learning services for EVAT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "googlemaps>=4.10,<5",
    "holidays>=0.60,<1",
    "joblib>=1.4,<2",
    "kmodes>=0.12,<1",
    "lightgbm>=4.5,<5",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.9,<3",
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
    "scikit-learn>=1.8,<1.9",
    "uvicorn[standard]>=0.30,<1",
    "vadersentiment>=3.3,<4",
    "xgboost>=2.1,<4",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["charging_station_recommendation_api/tests", "tests"]

[tool.uv]
package = false
